<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="Local businesses supporting the Alconbury Weald Community Association." />
  <title>AWCA business supporters</title>
  <meta name="theme-color" content="#4f5139" />
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <style>
    :root {
      --olive: #4f5139;
      --olive-dark: #3f412d;
      --cream: #f4f1e6;
      --cream-soft: rgba(244, 241, 230, 0.82);
      --line: rgba(244, 241, 230, 0.22);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: transparent;
      color: var(--cream);
      font-family: "DM Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 8px;
    }

    .panel {
      background: var(--olive);
      border-radius: 4px;
      padding: 22px 20px 24px;
    }

    .head {
      text-align: center;
      margin: 0 0 18px;
    }

    .head h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    .head p {
      margin: 6px 0 0;
      font-size: 0.9rem;
      color: var(--cream-soft);
    }

    .grid {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 12px 10px 14px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--olive-dark);
      text-align: center;
    }

    .logo {
      width: 100%;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border-radius: 3px;
      overflow: hidden;
    }

    .logo img {
      max-width: 88%;
      max-height: 84%;
      object-fit: contain;
    }

    .logo.initial {
      background: var(--cream);
      color: var(--olive);
      font-size: 2.2rem;
      font-weight: 600;
    }

    .name {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .status {
      margin: 0;
      text-align: center;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--cream-soft);
    }

    .empty h2 {
      margin: 0 0 6px;
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--cream);
    }

    .example {
      margin: 0 0 14px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--cream-soft);
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="panel" aria-labelledby="title">
      <header class="head">
        <h1 id="title">Business supporters</h1>
        <p>Thank you to the local businesses backing our community.</p>
      </header>
      <p id="example" class="example" hidden>Example data. Not real supporters.</p>
      <div id="status" class="status" role="status">Loading business supporters.</div>
      <ul id="grid" class="grid" hidden></ul>
    </section>
  </main>
  <script>
    const EXAMPLE = [
      { name: "Weald Coffee Co", logoUrl: null },
      { name: "Alconbury Garden Services", logoUrl: null },
      { name: "The Village Bakery", logoUrl: null }
    ];

    const statusEl = document.getElementById("status");
    const grid = document.getElementById("grid");
    const example = document.getElementById("example");

    function showMessage(text) {
      grid.hidden = true;
      grid.replaceChildren();
      statusEl.hidden = false;
      statusEl.className = "status";
      statusEl.textContent = text;
    }

    function showEmpty() {
      grid.hidden = true;
      grid.replaceChildren();
      statusEl.hidden = false;
      statusEl.className = "status empty";
      const title = document.createElement("h2");
      title.textContent = "Become our first business supporter";
      const text = document.createElement("p");
      text.style.margin = "0";
      text.textContent = "Join the AWCA Business Membership and your logo will appear here.";
      statusEl.replaceChildren(title, text);
    }

    function initialTile(name) {
      const tile = document.createElement("div");
      tile.className = "logo initial";
      tile.setAttribute("aria-hidden", "true");
      tile.textContent = (name.trim()[0] || "A").toUpperCase();
      return tile;
    }

    function logoTile(item) {
      if (!item.logoUrl) return initialTile(item.name);
      const box = document.createElement("div");
      box.className = "logo";
      const img = document.createElement("img");
      img.src = item.logoUrl;
      img.alt = `${item.name} logo`;
      img.loading = "lazy";
      img.referrerPolicy = "no-referrer";
      img.addEventListener("error", () => box.replaceWith(initialTile(item.name)));
      box.append(img);
      return box;
    }

    function render(data) {
      example.hidden = data.example !== true;
      const supporters = Array.isArray(data.supporters) ? data.supporters.filter((s) => s && s.name) : [];
      if (data.available === false) {
        showMessage("Business supporters could not be loaded right now. Please check back soon.");
        return;
      }
      if (supporters.length === 0) {
        showEmpty();
        return;
      }
      statusEl.hidden = true;
      grid.hidden = false;
      grid.replaceChildren();
      for (const item of supporters) {
        const li = document.createElement("li");
        li.className = "card";
        const name = document.createElement("p");
        name.className = "name";
        name.textContent = item.name;
        li.append(logoTile(item), name);
        grid.append(li);
      }
    }

    async function load() {
      try {
        const response = await fetch("/api/business-supporters", { headers: { Accept: "application/json" } });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          render({ available: false });
          return;
        }
        render(data);
      } catch (error) {
        console.error(error);
        render({ available: false });
      }
    }

    const params = new URLSearchParams(location.search);
    if (params.get("example") === "1") {
      render({ available: true, example: true, supporters: EXAMPLE });
    } else if (params.get("empty") === "1") {
      render({ available: true, supporters: [] });
    } else {
      load();
    }
  </script>
</body>
</html>
