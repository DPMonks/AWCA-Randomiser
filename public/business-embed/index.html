<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="Local businesses supporting the Alconbury Weald Community Association." />
  <title>AWCA business supporters</title>
  <meta name="theme-color" content="#4f5139" />
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <style>
    :root {
      --olive: #4f5139;
      --olive-dark: #3f412d;
      --cream: #f4f1e6;
      --cream-soft: rgba(244, 241, 230, 0.82);
      --line: rgba(244, 241, 230, 0.22);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: transparent;
      color: var(--cream);
      font-family: "DM Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
    }

    .wrap {
      height: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: clamp(4px, 1vw, 8px);
    }

    .panel {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--olive);
      border-radius: 4px;
      padding: clamp(8px, 1.6vw, 14px) clamp(8px, 1.8vw, 16px);
      overflow: hidden;
    }

    .head {
      flex: 0 0 auto;
      min-width: 0;
      text-align: center;
      margin: 0 0 clamp(4px, 1vw, 8px);
    }

    .head h1 {
      margin: 0;
      font-size: clamp(0.95rem, 2.5vw, 1.3rem);
      font-weight: 400;
      letter-spacing: 0.01em;
      line-height: 1.15;
    }

    .head p {
      margin: clamp(2px, 0.5vw, 4px) 0 0;
      font-size: clamp(0.68rem, 1.7vw, 0.82rem);
      line-height: 1.25;
      color: var(--cream-soft);
    }

    .grid {
      list-style: none;
      margin: 0;
      padding: 0;
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-flow: row nowrap;
      align-items: center;
      gap: clamp(6px, 1.4vw, 12px);
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }

    .grid::-webkit-scrollbar {
      display: none;
      height: 0;
    }

    .card {
      flex: 0 0 clamp(72px, 28vw, 168px);
      width: clamp(72px, 28vw, 168px);
      max-height: 100%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(4px, 0.8vw, 8px);
      padding: clamp(6px, 1vw, 10px);
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--olive-dark);
      text-align: center;
      overflow: hidden;
    }

    .logo {
      width: 100%;
      aspect-ratio: 4 / 3;
      flex: 0 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border-radius: 3px;
      overflow: hidden;
      container-type: inline-size;
    }

    .logo img {
      max-width: 88%;
      max-height: 84%;
      object-fit: contain;
    }

    .logo.initial {
      background: var(--cream);
      color: var(--olive);
      font-size: clamp(0.95rem, 38cqw, 2rem);
      font-weight: 600;
    }

    .name {
      margin: 0;
      width: 100%;
      min-width: 0;
      min-height: 2.4em;
      font-size: clamp(0.62rem, 1.8vw, 0.9rem);
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
    }

    .status {
      margin: 0;
      min-width: 0;
      text-align: center;
      font-size: clamp(0.7rem, 1.9vw, 0.88rem);
      line-height: 1.3;
      color: var(--cream-soft);
      overflow-wrap: break-word;
    }

    .empty h2 {
      margin: 0 0 clamp(2px, 0.6vw, 6px);
      font-size: clamp(0.85rem, 2.5vw, 1.05rem);
      font-weight: 500;
      line-height: 1.2;
      color: var(--cream);
    }

    .empty p {
      font-size: clamp(0.7rem, 1.9vw, 0.86rem);
      line-height: 1.3;
    }

    .example {
      margin: 0 0 clamp(4px, 0.8vw, 8px);
      flex: 0 0 auto;
      text-align: center;
      font-size: clamp(0.64rem, 1.6vw, 0.76rem);
      line-height: 1.2;
      color: var(--cream-soft);
    }

    .card-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(4px, 0.8vw, 8px);
      width: 100%;
      min-width: 0;
      min-height: 0;
      color: inherit;
      text-decoration: none;
    }

    .card-link:hover .name,
    .card-link:focus .name {
      text-decoration: underline;
    }

    .more {
      margin: clamp(4px, 1vw, 8px) 0 0;
      flex: 0 0 auto;
      text-align: center;
      font-size: clamp(0.7rem, 1.7vw, 0.82rem);
      line-height: 1.25;
    }

    .more a {
      color: var(--cream);
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="panel" aria-labelledby="title">
      <header class="head">
        <h1 id="title">Business supporters</h1>
        <p>Thank you to the local businesses backing our community.</p>
      </header>
      <p id="example" class="example" hidden>Example data. Not real supporters.</p>
      <div id="status" class="status" role="status">Loading business supporters.</div>
      <ul id="grid" class="grid" hidden></ul>
      <p class="more"><a href="/businesses" target="_blank" rel="noopener">View all business supporters</a></p>
    </section>
  </main>
  <script src="/biz-beacon.js"></script>
  <script>
    const EXAMPLE = [
      { name: "Weald Coffee Co", logoUrl: null, slug: "weald-coffee-co" },
      { name: "Alconbury Garden Services", logoUrl: null, slug: "alconbury-garden-services" },
      { name: "The Village Bakery", logoUrl: null, slug: "the-village-bakery" }
    ];

    const statusEl = document.getElementById("status");
    const grid = document.getElementById("grid");
    const example = document.getElementById("example");

    function showMessage(text) {
      grid.hidden = true;
      grid.replaceChildren();
      statusEl.hidden = false;
      statusEl.className = "status";
      statusEl.textContent = text;
    }

    function showEmpty() {
      grid.hidden = true;
      grid.replaceChildren();
      statusEl.hidden = false;
      statusEl.className = "status empty";
      const title = document.createElement("h2");
      title.textContent = "Become our first business supporter";
      const text = document.createElement("p");
      text.style.margin = "0";
      text.textContent = "Join the AWCA Business Membership and your logo will appear here.";
      statusEl.replaceChildren(title, text);
    }

    function initialTile(name) {
      const tile = document.createElement("div");
      tile.className = "logo initial";
      tile.setAttribute("aria-hidden", "true");
      tile.textContent = (name.trim()[0] || "A").toUpperCase();
      return tile;
    }

    function logoTile(item) {
      if (!item.logoUrl) return initialTile(item.name);
      const box = document.createElement("div");
      box.className = "logo";
      const img = document.createElement("img");
      img.src = item.logoUrl;
      img.alt = `${item.name} logo`;
      img.loading = "lazy";
      img.referrerPolicy = "no-referrer";
      img.addEventListener("error", () => box.replaceWith(initialTile(item.name)));
      box.append(img);
      return box;
    }

    function render(data) {
      example.hidden = data.example !== true;
      const supporters = Array.isArray(data.supporters) ? data.supporters.filter((s) => s && s.name) : [];
      if (data.available === false) {
        showMessage("Business supporters could not be loaded right now. Please check back soon.");
        return;
      }
      if (supporters.length === 0) {
        showEmpty();
        return;
      }
      statusEl.hidden = true;
      grid.hidden = false;
      grid.replaceChildren();
      for (const item of supporters) {
        const li = document.createElement("li");
        li.className = "card";
        const name = document.createElement("p");
        name.className = "name";
        name.textContent = item.name;
        const logo = logoTile(item);
        if (item.slug) {
          const link = document.createElement("a");
          link.className = "card-link";
          link.href = `/businesses/${encodeURIComponent(item.slug)}`;
          link.target = "_blank";
          link.rel = "noopener";
          link.setAttribute("data-business-click", item.slug);
          link.append(logo, name);
          li.append(link);
          li.setAttribute("data-business-view", item.slug);
        } else {
          li.append(logo, name);
        }
        grid.append(li);
      }
      const slugs = supporters.map((item) => item.slug).filter(Boolean);
      if (window.awcaRecordViews) window.awcaRecordViews(slugs);
    }

    async function load() {
      try {
        const response = await fetch("/api/business-supporters", { headers: { Accept: "application/json" } });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          render({ available: false });
          return;
        }
        render(data);
      } catch (error) {
        console.error(error);
        render({ available: false });
      }
    }

    const params = new URLSearchParams(location.search);
    if (params.get("example") === "1") {
      render({ available: true, example: true, supporters: EXAMPLE });
    } else if (params.get("empty") === "1") {
      render({ available: true, supporters: [] });
    } else {
      load();
    }
  </script>
</body>
</html>
