<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AWCA Lottery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="awca-header">
  <div class="awca-header-inner">
    <h1>AWCA Lottery</h1>
    <p>Official monthly community draw for Alconbury Weald</p>
  </div>
</header>

<main class="awca-main">

  <!-- LEFT: Dashboard -->
  <section class="awca-panel">
    <h2>Lottery Dashboard</h2>

    <div class="awca-stats">
      <div class="awca-stat">
        <h3>Total Entries</h3>
        <p id="total-entries">–</p>
      </div>

      <div class="awca-stat">
        <h3>Total Winnings Available</h3>
        <p id="total-winnings">–</p>
      </div>

      <div class="awca-stat">
        <h3>Next Draw</h3>
        <p id="next-draw">1st of next month @ 20:00 UK time</p>
      </div>

      <div class="awca-stat">
        <h3>Last Winner</h3>
        <p id="last-winner-name">–</p>
        <p id="last-winner-email" class="awca-subtext">–</p>
      </div>
    </div>

    <button id="draw-button" class="awca-draw-btn">Draw Winner</button>

    <div class="awca-result">
      <h3>Draw Result</h3>
      <p id="winner-name">–</p>
      <p id="winner-email" class="awca-subtext">–</p>
      <p id="winner-time" class="awca-subtext">–</p>
    </div>
  </section>

  <!-- RIGHT: 3D Lottery Machine -->
  <section class="awca-3d-panel">
    <h2>3D Lottery Machine</h2>
    <canvas id="lotteryCanvas"></canvas>
  </section>

</main>

<footer class="awca-footer">
  <p>&copy; AWCA Lottery — Alconbury Weald Community</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="main.js"></script>

</body>
</html>
